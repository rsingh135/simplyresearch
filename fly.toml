# fly.toml app configuration file generated for simplyresearch on 2026-01-11T17:59:53-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'simplyresearch'
primary_region = 'ord'
console_command = '/rails/bin/rails console'

[build]

[env]
  # Tell Rails/Puma to listen directly on port 8080
  PORT = "8080"

[processes]
  # Run Rails directly (simpler, no Thruster)
  app = "./bin/rails server -b 0.0.0.0"
  job = "bundle exec good_job start"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  timeout = "5s"
  method = "GET"
  path = "/up"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
