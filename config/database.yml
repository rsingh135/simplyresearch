# PostgreSQL
#   gem install pg
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # PostgreSQL requires a username and password.
  # It's best practice to use environment variables for these in production,
  # and Rails credentials for local development.
  host: <%= ENV["DB_HOST"] || "localhost" %> # Default to localhost, overridden by ENV in production

development:
  <<: *default
  database: simplyresearch_development # PostgreSQL uses database names, not file paths
  username: <%= Rails.application.credentials.dig(:database, :development, :username) %>
  password: <%= Rails.application.credentials.dig(:database, :development, :password) %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: simplyresearch_test
  username: <%= ENV["DB_USERNAME"] || ENV["POSTGRES_USER"] || Rails.application.credentials.dig(:database, :test, :username) || "postgres" %>
  password: <%= ENV["DB_PASSWORD"] || ENV["POSTGRES_PASSWORD"] || Rails.application.credentials.dig(:database, :test, :password) || "password" %>

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
  cable:
    <<: *primary_production
  queue:
    <<: *primary_production
